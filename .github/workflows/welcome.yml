name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome New Contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome @${{ github.actor }}! Thank you for opening your first issue in **Feature Store (Eddy)**! 🎉
            
            - If you would like to work on this, comment `/assign` or `.take` to get automatically assigned!
            - Check our [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) for local setup instructions.
            - If you find this project helpful, please consider leaving a ⭐ on the repository!
          pr-message: |
            🎉 Awesome! Thank you @${{ github.actor }} for submitting your first Pull Request to **Feature Store (Eddy)**!
            
            Our automated CI checks will run shortly. A maintainer will review your changes soon. In the meantime, feel free to drop a ⭐ on the project if you haven't already!
