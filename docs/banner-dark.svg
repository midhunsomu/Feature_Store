<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Eddy — event-time features with sub-millisecond serving">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0F14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2430" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="#0B0F14"/>
  <rect width="1280" height="300" fill="url(#grid)" opacity="0.55"/>

  <!-- signal path -->
  <g stroke="#2A3646" stroke-width="1.5" fill="none">
    <path d="M760 150 H1180"/>
  </g>
  <g stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M760 150 H900" opacity="0.9"/>
    <path d="M980 150 H1060" opacity="0.6"/>
  </g>
  <g fill="#0B0F14" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="780" cy="150" r="9"/>
    <circle cx="900" cy="150" r="9"/>
    <circle cx="1020" cy="150" r="9"/>
    <circle cx="1140" cy="150" r="9"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="780" cy="150" r="3.5"/>
    <circle cx="900" cy="150" r="3.5"/>
    <circle cx="1020" cy="150" r="3.5"/>
    <circle cx="1140" cy="150" r="3.5"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6B7A8C" text-anchor="middle" letter-spacing="2">
    <text x="780" y="186">EVENTS</text>
    <text x="900" y="186">WINDOWS</text>
    <text x="1020" y="186">STORE</text>
    <text x="1140" y="186">SERVE</text>
  </g>

  <!-- wordmark -->
  <text x="72" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="88" font-weight="700" letter-spacing="10" fill="#E6EDF3">EDDY</text>
  <rect x="72" y="176" width="120" height="3" fill="url(#accent)"/>
  <text x="72" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="17" fill="#9AA9BA" letter-spacing="1.5">event-time features · sub-millisecond serving</text>
  <text x="72" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#4E5D70" letter-spacing="1">kafka / avro / spark structured streaming / redis / fastapi</text>

  <rect y="297" width="1280" height="3" fill="url(#accent)" opacity="0.9"/>
</svg>
